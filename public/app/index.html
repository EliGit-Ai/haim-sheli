<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>חיים שלי</title>
<style>
/* Everything here is local: fonts are self-hosted, no analytics, no third-party requests.
   The man's answers live only in this device's storage (localStorage). */
@font-face{font-family:"Frank Ruhl Libre";font-weight:700;font-display:swap;src:url(/app/fonts/frank-ruhl-libre-hebrew-700-normal.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Frank Ruhl Libre";font-weight:900;font-display:swap;src:url(/app/fonts/frank-ruhl-libre-hebrew-900-normal.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Frank Ruhl Libre";font-weight:700 900;font-display:swap;src:url(/app/fonts/frank-ruhl-libre-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Assistant";font-weight:400;font-display:swap;src:url(/app/fonts/assistant-hebrew-400-normal.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Assistant";font-weight:600 700;font-display:swap;src:url(/app/fonts/assistant-hebrew-700-normal.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Assistant";font-weight:400;font-display:swap;src:url(/app/fonts/assistant-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Assistant";font-weight:600 700;font-display:swap;src:url(/app/fonts/assistant-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#EEF1EA; --surface:#F7F8F4; --band:#E2E8DC; --ink:#1D2820; --muted:#56635A; --line:#C9D2C3;
  --moss:#4E6B3C; --moss-ink:#F4F7F0; --sand:#B89A6A;
  --m1:#8FA98A; --m2:#5E8455; --m3:#2F4F2A; --rest:#D6C7A8; --faint:#D5DCD0;
  --display:"Frank Ruhl Libre", "David Libre", Georgia, serif;
  --body:"Assistant", "Heebo", "Segoe UI", Arial, sans-serif;
  --safe-b:env(safe-area-inset-bottom, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B16; --surface:#1B241D; --band:#1F2A22; --ink:#E6ECE2; --muted:#A3B0A5; --line:#33433A;
  --moss:#9BBE84; --moss-ink:#142012; --sand:#CDB384;
  --m1:#56704F; --m2:#7FA470; --m3:#B6D3A2; --rest:#6E6247; --faint:#26322A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B16; --surface:#1B241D; --band:#1F2A22; --ink:#E6ECE2; --muted:#A3B0A5; --line:#33433A;
  --moss:#9BBE84; --moss-ink:#142012; --sand:#CDB384;
  --m1:#56704F; --m2:#7FA470; --m3:#B6D3A2; --rest:#6E6247; --faint:#26322A; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.65;direction:rtl;min-height:100dvh;
  padding-top:env(safe-area-inset-top, 0px)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:inherit}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:15px}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.03em;color:var(--moss)}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

main{max-width:620px;margin:0 auto;padding:20px 16px calc(96px + var(--safe-b))}
main.no-nav{padding-bottom:calc(32px + var(--safe-b))}
.stack{display:grid;gap:16px}
.stack-lg{display:grid;gap:28px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--moss);color:var(--moss-ink);font-weight:700;font-size:18px;
  border:0;border-radius:999px;padding:13px 24px;cursor:pointer;text-decoration:none;min-height:48px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:transparent;color:var(--moss);padding:8px 4px;min-height:auto;font-size:16px}
.btn[disabled]{opacity:.5;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.card.band{background:var(--band);border-color:transparent}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;min-height:40px}
.brand{font-family:var(--display);font-weight:900;font-size:22px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;cursor:pointer;color:var(--muted);font-size:16px}
.back svg{width:18px;height:18px}

/* bottom nav */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:5;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs a{display:grid;justify-items:center;gap:2px;padding:9px 4px 8px;text-decoration:none;font-size:13px;font-weight:700;color:var(--muted)}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--moss)}

/* home */
.hello h1{font-size:clamp(30px,8vw,40px);font-weight:900}
.today-card{display:grid;gap:12px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.today-card h2{font-size:28px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.status i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.status.done i{background:var(--moss)}
.status.started i{background:var(--sand)}
.track{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:7px}
.dot{aspect-ratio:1;border-radius:50%;border:0;padding:0;background:var(--faint);cursor:default;display:grid;place-items:center;color:var(--bg)}
.dot svg{width:62%;height:62%}
.dot.open{background:transparent;border:2px solid var(--m1);cursor:pointer}
.dot.m2.open{border-color:var(--m2)} .dot.m3.open{border-color:var(--m3)} .dot.rest.open{border-color:var(--rest)}
.dot.done{background:var(--m1);border:0;cursor:pointer}
.dot.m2.done{background:var(--m2)} .dot.m3.done{background:var(--m3)} .dot.rest.done{background:var(--rest)}
.dot.today{outline:2px solid var(--sand);outline-offset:2px}
.dot.paid{background:transparent;border:2px dashed var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--m1)}
.legend i.v{width:14px;height:14px;display:inline-grid;place-items:center;color:var(--bg)}
.legend i.v svg{width:70%;height:70%}
.legend i.o{background:transparent;border:2px solid var(--m1)}
.legend i.f{background:var(--faint)}

.notice{display:grid;gap:10px;border-radius:16px;padding:16px 18px;background:var(--band)}
.notice h3{font-size:19px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* day */
.day-head{display:grid;gap:8px}
.day-head h1{font-size:clamp(30px,8.5vw,42px);font-weight:900}
.narration{display:grid;gap:14px;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.6}
.narration .w{display:inline-block;border-radius:6px;padding-inline:2px;margin-inline:-1px;transform-origin:center 60%;transition:color .25s ease, transform .18s ease, background-color .25s ease}
.narration.playing .w{color:var(--muted)}
.narration.playing .w.read{color:var(--ink)}
.narration .w.now{color:var(--moss);transform:scale(1.1);background:var(--faint)}
.listen{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.listen .row{display:flex;align-items:center;gap:12px}
.listen .play{width:48px;height:48px;flex:none;border-radius:50%;border:0;background:var(--moss);color:var(--moss-ink);display:grid;place-items:center;cursor:pointer}
.listen .play svg{width:20px;height:20px}
.listen .bar{flex:1;min-width:0;display:grid;gap:3px}
.listen .track{height:6px;border-radius:3px;background:var(--faint);overflow:hidden;cursor:pointer}
.listen .fill{height:100%;width:0;background:var(--moss)}
.listen .time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.listen .music{font:inherit;font-size:14px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;justify-self:start}
.listen .music[aria-pressed="true"]{color:var(--moss);font-weight:700}
@media (prefers-reduced-motion: reduce){.narration .w{transition:none}.narration .w.now{transform:none}}
.part{display:grid;gap:18px}
.part-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:2px solid var(--m1);padding-top:14px}
.part-title h2{font-size:24px}
.part-title .when{font-size:14px;font-weight:700;color:var(--muted)}
.block{display:grid;gap:10px}
.prompt{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:17px;line-height:1.35;text-align:start;min-height:44px}
.chip[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;direction:rtl}
.scale button{aspect-ratio:1;min-height:30px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:16px;padding:0;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.compare{font-size:15px;color:var(--muted);background:var(--band);border-radius:10px;padding:8px 12px}
.compare b{color:var(--ink)}
textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;font-size:17px;line-height:1.5}
.note-toggle{justify-self:start}
.check{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:13px 16px;background:var(--surface);cursor:pointer;font-weight:700;width:100%;text-align:start}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--m2);display:grid;place-items:center;flex:none}
.check .box svg{width:16px;height:16px;opacity:0}
.check[aria-pressed="true"]{border-color:var(--moss);background:color-mix(in srgb, var(--moss) 10%, var(--surface))}
.check[aria-pressed="true"] .box{background:var(--moss);border-color:var(--moss)}
.check[aria-pressed="true"] .box svg{opacity:1;color:var(--moss-ink)}
.midday{display:grid;gap:4px;border-inline-start:3px solid var(--sand);padding:4px 14px}
.midday .t{font-size:14px;font-weight:700;color:var(--muted)}
.saved{font-size:14px;color:var(--muted);text-align:center}
.daynav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
audio{width:100%}

/* journal */
.entry{display:grid;gap:8px;padding-block:16px;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry h3{font-size:20px}
.entry .meta{font-size:14px;color:var(--muted)}
.entry ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:16px}
.entry li b{font-weight:700}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

/* forms */
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}
legend{padding:0;font-weight:700}
.seg{display:flex;gap:10px}
.seg button{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 12px;background:var(--surface);font-weight:700;cursor:pointer;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
select{font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;min-width:7.5em}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;font-size:16px;direction:ltr;text-align:right}
.settings section{display:grid;gap:12px;padding-block:22px;border-top:1px solid var(--line)}
.settings section:first-of-type{border-top:0;padding-top:4px}
.settings h2{font-size:22px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 12px;background:var(--band);font-size:15px;font-weight:700}

/* install sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,15,12,.45);display:grid;align-items:end}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;padding:22px 18px calc(22px + var(--safe-b));max-width:620px;width:100%;margin:0 auto;display:grid;gap:16px;max-height:88dvh;overflow:auto}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--moss);color:var(--moss-ink);display:grid;place-items:center;font-weight:700}
.ico{display:inline-block;vertical-align:-4px;width:20px;height:20px}

.toast{position:fixed;inset-inline:16px;bottom:calc(84px + var(--safe-b));z-index:30;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:12px 16px;font-size:16px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.loading{display:grid;place-items:center;min-height:60dvh;color:var(--muted)}
</style>
</head>
<body>
<main id="view" aria-live="polite"><div class="loading">רגע...</div></main>
<nav class="tabs" id="tabs" hidden aria-label="ניווט">
  <div class="in">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>היום</a>
    <a href="#/journal" data-tab="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h11a1.5 1.5 0 0 1 1.5 1.5v14.5H7a1.5 1.5 0 0 1-1.5-1.5V4"/><path d="M5.5 18a1.5 1.5 0 0 1 1.5-1.5h11.5"/><path d="M9.5 8h5.5M9.5 11.5h4"/></svg>היומן שלי</a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>הגדרות</a>
  </div>
</nav>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
"use strict";

// ---------------------------------------------------------------- storage
// Everything the man answers stays in this object, in this browser only.
const KEY = "haim-sheli:v1";
const PROGRAM_KEY = "haim-sheli:program";
const blank = () => ({ profile: null, start: null, code: null, answers: {} });

function load() {
  try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch { return blank(); }
}
let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch { toast("לא הצלחנו לשמור במכשיר. כדאי לבדוק שיש מקום פנוי."); return false; }
}
let program = (() => { try { return JSON.parse(localStorage.getItem(PROGRAM_KEY)); } catch { return null; } })();

// ---------------------------------------------------------------- helpers
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  share: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3.5M8 7.5l4-4 4 4"/><path d="M7 11H5.5v9.5h13V11H17"/></svg>',
  plus: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
  dots: '<svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
};

let toastTimer;
function toast(text) {
  const t = $("#toast");
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 3200);
}

// dates are handled as local calendar days, "YYYY-MM-DD"
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((Date.UTC(...ymd(b)) - Date.UTC(...ymd(a))) / 86400000);
const ymd = s => { const [y, m, d] = s.split("-").map(Number); return [y, m - 1, d]; };
// days 1 and 2 open together on the start day; from day 3 on, one day per calendar day
const dateOfDay = n => { const d = parseISO(state.start); d.setDate(d.getDate() + Math.max(0, n - 2)); return d; };
const WEEKDAY = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];

const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

// ---------------------------------------------------------------- program access
// The only network request: "send me the content". Nothing about the man is sent.
async function fetchProgram() {
  const headers = state.code ? { authorization: `Bearer ${state.code}` } : {};
  const res = await fetch("/api/program", { headers, cache: "no-store" });
  if (!res.ok) throw new Error("program " + res.status);
  const data = await res.json();
  program = data;
  try { localStorage.setItem(PROGRAM_KEY, JSON.stringify(data)); } catch { /* the app still works this session */ }
  return data;
}

const allowedDays = () => (program?.access === "full" ? 90 : program?.freeDays || 3);

// which day the calendar has reached; Shabbat observers get Saturday's day on Friday
function reachedDay() {
  if (!state.start) return 2;
  let n = daysBetween(state.start, todayISO()) + 2;
  if (state.profile?.shabbat === "yes" && new Date().getDay() === 5) n += 1;
  return Math.max(1, Math.min(90, n));
}
const openThrough = () => Math.min(reachedDay(), allowedDays());

function dayContent(n) {
  if (!program) return null;
  const alt = state.profile?.relationship === "no" && program.alternates?.noRelationship?.find(d => d.day === n)
    || state.profile?.kids === "no" && program.alternates?.noKids?.find(d => d.day === n);
  return alt || program.days.find(d => d.day === n) || null;
}
const dayMeta = n => program?.map?.find(d => d.day === n) || { day: n, title: "", month: n <= 30 ? 1 : n <= 60 ? 2 : 3 };

// ---------------------------------------------------------------- answers
const ans = n => state.answers[n] || (state.answers[n] = { step: {}, evening: {} });
const peek = n => state.answers[n];
function touch(n) { ans(n).at = Date.now(); save(); }

function dayStatus(n) {
  const a = peek(n);
  if (!a) return "none";
  const ev = Object.keys(a.evening || {}).length > 0 || (a.eveningNote || "").trim();
  if (a.stepDone && (ev || dayMeta(n).rest || n === 1)) return "done";
  if (a.stepDone || ev || Object.keys(a.step || {}).length || (a.stepNote || "").trim()) return "started";
  return "none";
}

// find an answer by its question key ("control", "fulfilled"...) on another day
function answerByKey(n, key) {
  const content = program?.days.find(x => x.day === n);
  const a = peek(n);
  if (!content || !a) return undefined;
  for (const part of ["step", "evening"]) {
    const blocks = content[part]?.blocks || [];
    for (let i = 0; i < blocks.length; i++) if (blocks[i].key === key && a[part]?.[i] !== undefined) return a[part][i];
  }
  return undefined;
}

// ---------------------------------------------------------------- router
const routes = { home: renderHome, day: renderDay, journal: renderJournal, settings: renderSettings, welcome: renderWelcome, install: renderInstallFirst };

function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const [name, arg] = hash.split("/");
  if (!state.profile) {
    // on iPhone the home-screen app keeps its own storage, so set it up there and not in Safari
    if (isIOS() && !isStandalone() && sessionStorage.getItem("hs-skip-install") !== "1") return show("install");
    return show("welcome");
  }
  if (name === "day" && arg) return show("day", Number(arg));
  if (name === "journal") return show("journal");
  if (name === "settings") return show("settings");
  return show("home");
}

function show(name, arg) {
  const tabs = $("#tabs");
  const withTabs = ["home", "journal", "settings"].includes(name);
  tabs.hidden = !withTabs;
  $("#view").classList.toggle("no-nav", !withTabs);
  tabs.querySelectorAll("a").forEach(a => { if (a.dataset.tab === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  routes[name](arg);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => {
  stopListening();
  if (!location.hash.startsWith("#/day/")) { music.want = 0; musicSync(); } // home, journal, settings: quiet
  route();
});

function trackHTML() {
  const open = openThrough(), reached = reachedDay(), allowed = allowedDays();
  let html = "";
  for (let n = 1; n <= 90; n++) {
    const m = dayMeta(n);
    const cls = ["dot", m.month === 2 ? "m2" : m.month === 3 ? "m3" : "", m.rest ? "rest" : ""];
    const st = dayStatus(n);
    if (n <= open) cls.push(st === "done" ? "done" : "open");
    else if (n > allowed && n <= reached) cls.push("paid");
    if (n === Math.min(reached, 90)) cls.push("today");
    const can = n <= open;
    html += `<button type="button" class="${cls.join(" ").replace(/\s+/g, " ")}" ${can ? `data-day="${n}"` : "disabled"} aria-label="יום ${n}${st === "done" && can ? " (הושלם)" : can ? "" : " (עוד לא נפתח)"}">${st === "done" && can ? ICON.check : ""}</button>`;
  }
  return `<div class="track" id="track">${html}</div>`;
}

// ---------- notifications
// The server keeps only what it needs to know which day to send and when: the phone's push address,
// the start date, the time zone, the chosen hours and the three profile answers. No answers, no email.
const DEFAULT_HOURS = { morning: 8, midday: 13, evening: 21 };
const SLOT_NAMES = { morning: "בוקר: היום החדש", midday: "צהריים: תזכורת לצעד", evening: "ערב: שאלה לערב" };
const pushHours = () => ({ ...DEFAULT_HOURS, ...(state.push?.hours || {}) });
let pushKey; // undefined = not checked yet, null = the server has no push yet

function pushSupport() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    return isIOS() && !isStandalone() ? "needs-install" : "unsupported";
  }
  if (isIOS() && !isStandalone()) return "needs-install";
  if (Notification.permission === "denied") return "denied";
  return "ok";
}

async function getPushKey() {
  if (pushKey !== undefined) return pushKey;
  try {
    const r = await fetch("/api/push/key", { cache: "no-store" });
    const d = await r.json();
    pushKey = d.enabled ? d.key : null;
  } catch { return null; }
  return pushKey;
}

const b64ToBytes = s => { const p = "=".repeat((4 - (s.length % 4)) % 4); const raw = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, c => c.charCodeAt(0)); };

async function sendSubscription(sub) {
  const res = await fetch("/api/push/subscribe", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      subscription: sub.toJSON(),
      start: state.start,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Jerusalem",
      profile: state.profile,
      hours: pushHours(),
      code: state.code || undefined,
    }),
  });
  if (!res.ok) { const e = new Error("subscribe " + res.status); e.stage = "server"; e.status = res.status; throw e; }
}

// must run from a tap: iPhone asks for permission only after a user action
async function enablePush() {
  const support = pushSupport();
  if (support !== "ok") return support;
  const key = await getPushKey();
  if (!key) return "server";
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return perm === "denied" ? "denied" : "dismissed";
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) }); }
      catch { return "device"; }
    }
    await sendSubscription(sub);
    state.push = { on: true, hours: pushHours(), synced: todayISO() }; save();
    return "on";
  } catch (e) { return e?.stage === "server" ? (e.status === 503 ? "server" : "save") : "error"; }
}

async function disablePush() {
  state.push = { ...(state.push || {}), on: false }; save();
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await fetch("/api/push/subscribe", { method: "DELETE", headers: { "content-type": "application/json" }, body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {});
      await sub.unsubscribe().catch(() => {});
    }
  } catch {}
}

// keeps the server's copy in step after a change (hours, profile, code) and once a day
async function syncPush(force) {
  if (!state.push?.on || pushSupport() !== "ok" || Notification.permission !== "granted") return;
  if (!force && state.push.synced === todayISO()) return;
  try {
    const key = await getPushKey();
    if (!key) return;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
    await sendSubscription(sub);
    state.push.synced = todayISO(); save();
  } catch {}
}

const PUSH_RESULT = {
  on: "ההתראות פועלות",
  denied: "ההתראות חסומות. אפשר לאשר אותן בהגדרות הטלפון, תחת \"חיים שלי\".",
  dismissed: "לא אישרת התראות. אפשר לנסות שוב מתי שתרצה.",
  server: "ההתראות עוד לא זמינות. ננסה שוב בקרוב.",
  "needs-install": "באייפון, התראות עובדות רק כשפותחים את האפליקציה ממסך הבית.",
  unsupported: "הדפדפן הזה לא תומך בהתראות.",
  device: "הטלפון לא הצליח להירשם להתראות. כדאי לסגור את האפליקציה לגמרי, לפתוח שוב מהאייקון ולנסות שוב.",
  save: "הטלפון אישר, אבל השרת לא הצליח לשמור את ההרשמה. ננסה לתקן ולחזור אליך.",
  error: "משהו השתבש. נסה שוב בעוד רגע.",
};

  return `<div class="notice" id="push-banner">

    <p class="small muted">בבוקר כשהיום נפתח, בצהריים לצעד, ובערב לשאלה. אפשר לשנות שעות או לכבות בהגדרות.</p>

  $("#push-no")?.addEventListener("click", () => { state.push = { ...(state.push || {}), dismissed: true }; save(); $("#push-banner").remove(); });
  $("#push-go")?.addEventListener("click", async e => {

  });
}

function pushSettingsHTML() {
  const support = pushSupport();
  const on = Boolean(state.push?.on) && support === "ok";
  const h = pushHours();
  const opts = sel => `<option value="">בלי</option>` + Array.from({ length: 24 }, (_, i) => `<option value="${i}" ${sel === i ? "selected" : ""}>${pad(i)}:00</option>`).join("");
  let status = "";
  if (support === "needs-install") status = `<p class="muted small">${PUSH_RESULT["needs-install"]}</p>`;
  else if (support === "unsupported") status = `<p class="muted small">${PUSH_RESULT.unsupported}</p>`;
  else if (support === "denied") status = `<p class="muted small">${PUSH_RESULT.denied}</p>`;
  return `<section>
    <h2>התראות</h2>
    <p class="muted small">בשביל ההתראות נשמרים בשרת רק תאריך ההתחלה, השעות שבחרת ושלוש תשובות הפרופיל, כדי לדעת איזה יום לשלוח ומתי. התשובות שלך נשארות רק בטלפון.</p>
    ${status}
    ${support === "ok" ? `
      <div class="stack" style="gap:12px">
        ${["morning", "midday", "evening"].map(s => `<label class="row" style="justify-content:space-between" for="ph-${s}"><span>${SLOT_NAMES[s]}</span>
          <select id="ph-${s}" data-slot="${s}">${opts(h[s])}</select></label>`).join("")}
      </div>
      <div class="row"><button class="btn ${on ? "ghost" : ""}" id="push-toggle" type="button">${on ? "לכבות התראות" : "להפעיל התראות"}</button></div>` : ""}
  </section>`;
}
function bindPushSettings() {
  document.querySelectorAll("select[data-slot]").forEach(sel => sel.addEventListener("change", () => {
    const hours = pushHours();
    hours[sel.dataset.slot] = sel.value === "" ? null : Number(sel.value);
    state.push = { ...(state.push || {}), hours }; save();
    if (state.push.on) syncPush(true).then(() => toast("נשמר"));
  }));
  $("#push-toggle")?.addEventListener("click", async e => {
    e.target.disabled = true;
    if (state.push?.on) { await disablePush(); toast("ההתראות כבויות"); }
    else toast(PUSH_RESULT[await enablePush()] || PUSH_RESULT.error);
    renderSettings();
  });
}

// ---------- a day
function renderDay(n) {
  if (!program) return renderNoContent();
  if (!(n >= 1 && n <= 90)) { location.hash = "#/"; return; }
  if (n > allowedDays()) {
    $("#view").innerHTML = `<div class="stack-lg">${backBar()}${paywall()}</div>`; bindBack(); return;
  }
  if (n > reachedDay()) {
    const d = dateOfDay(n);
    if (state.profile?.shabbat === "yes" && d.getDay() === 6) d.setDate(d.getDate() - 1);
    $("#view").innerHTML = `<div class="stack-lg">${backBar()}<div class="notice"><h3>יום ${n} עוד לא נפתח</h3><p class="small muted">הוא ייפתח ביום ${WEEKDAY[d.getDay()]}. צעד אחד בכל יום.</p></div></div>`;
    bindBack(); return;
  }
  const c = dayContent(n), m = dayMeta(n);
  if (!c) return renderNoContent();
  const a = ans(n);
  const onShabbat = state.profile?.shabbat === "yes" && dateOfDay(n).getDay() === 6;

  const parts = [];
  if (c.step) parts.push(partHTML(n, "step", c.step, a));
  else parts.push(`<div class="part">${checkHTML(a.stepDone, c.rest ? "נחתי היום" : "עברתי על היום")}</div>`);
  if (c.midday) parts.push(`<div class="midday"><span class="t">לאמצע היום</span><p>${esc(c.midday)}</p></div>`);
  if (c.evening) parts.push(partHTML(n, "evening", c.evening, a, onShabbat));

  $("#view").innerHTML = `
    <div class="stack-lg">
      ${backBar()}
      <div class="day-head">
        <span class="eyebrow">יום ${n}${m.weekName || c.weekName ? ` · ${esc(c.weekName || m.weekName)}` : ""}</span>
        <h1>${esc(c.title)}</h1>
      </div>
      ${c.audio && c.timing ? listenHTML() : c.audio ? `<audio controls preload="none" src="${esc(c.audio)}"></audio>` : ""}
      ${narrationHTML(c)}
      ${parts.join("")}
      <p class="saved">${ICON.check.replace("<svg", '<svg class="ico"')} נשמר רק בטלפון שלך</p>
      <div class="daynav">
        ${n > 1 ? `<a class="btn ghost" href="#/day/${n - 1}">יום ${n - 1}</a>` : "<span></span>"}
        ${n < openThrough() ? `<a class="btn ghost" href="#/day/${n + 1}">יום ${n + 1}</a>` : `<a class="btn ghost" href="#/">למסך הבית</a>`}
      </div>
    </div>`;
  bindBack();
  bindDay(n, c);
  if (c.audio && c.timing) bindListen(c);
  musicFor(1); // the same soundscape on every day
}

// ---------- listening: narration over the month's background music, with the spoken word highlighted
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 5v14L6 12z"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
// ---------- background music: plays through all the day screens, one track per month
// It starts on the first tap (phones allow sound only after one), keeps playing while he moves
// between days, crossfades when the month changes, dips under the narration, and fades out when
// he leaves the days (home, journal, settings) or the app goes to the background.
// one jungle soundscape for every day, kept low: it is a background, not a soundtrack
const MUSIC_SRC = "/app/audio/bg-jungle.mp3";
const MUSIC_LEVEL = 0.3, MUSIC_UNDER_VOICE = 0.18;
const music = { el: null, ctx: null, gain: null, month: 0, want: 0, ducked: false, fadeTimer: 0 };
const musicOn = () => state.music !== false;

function musicGraph() {
  if (music.ctx) return;
  try { music.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { music.ctx = null; }
}
function musicTarget() { return musicOn() && music.want ? (music.ducked ? MUSIC_UNDER_VOICE : MUSIC_LEVEL) : 0; }
function rampTo(level, secs) {
  if (!music.el) return;
  if (music.gain && music.ctx) {
    const g = music.gain.gain, now = music.ctx.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(level, now + secs);
  } else music.el.volume = level;
}
function loadTrack(month) {
  const el = new Audio(MUSIC_SRC);
  el.loop = true; el.preload = "auto";
  let gain = null;
  if (music.ctx) {
    try { gain = music.ctx.createGain(); gain.gain.value = 0; music.ctx.createMediaElementSource(el).connect(gain).connect(music.ctx.destination); } catch { gain = null; }
  }
  if (!gain) el.volume = 0;
  return { el, gain };
}
async function musicSync() {
  clearTimeout(music.fadeTimer);
  const wanted = musicOn() ? music.want : 0;
  if (!wanted) { // fade out and stop
    rampTo(0, 1.5);
    const el = music.el;
    music.fadeTimer = setTimeout(() => { el?.pause(); }, 1600);
    return;
  }
  musicGraph();
  if (music.ctx?.state === "suspended") await music.ctx.resume().catch(() => {});
  if (music.month !== wanted || !music.el) { // a new month: crossfade to its track
    const old = music.el, oldGain = music.gain, oldCtx = music.ctx;
    const t = loadTrack(wanted);
    music.el = t.el; music.gain = t.gain; music.month = wanted;
    if (old) {
      if (oldGain && oldCtx) { const g = oldGain.gain, now = oldCtx.currentTime; g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(0, now + 2); }
      else old.volume = 0;
      setTimeout(() => old.pause(), 2100);
    }
  }
  try { await music.el.play(); } catch { return; } // blocked until he taps: the next tap retries
  rampTo(musicTarget(), 2);
}
function musicFor(month) { music.want = month; musicSync(); }
function musicDuck(on) { music.ducked = on; rampTo(musicTarget(), 0.6); }

// phones start sound only from a tap: any tap retries if music should be playing but is silent
document.addEventListener("pointerdown", () => {
  if (musicOn() && music.want && (!music.el || music.el.paused || music.ctx?.state === "suspended")) musicSync();
}, { capture: true });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { music.el?.pause(); if (listen) listen.voice.pause(); }
  else if (music.want) musicSync();
});
let listen = null; // the player of the day on screen

function narrationHTML(c) {
  // every word becomes a span that knows where it sits in the spoken text (paragraphs joined by "\n")
  let pos = 0;
  const paras = c.narration.map(p => {
    const html = p.split(/(\s+)/).map(tok => {
      const start = pos; pos += tok.length;
      return /^\s+$/.test(tok) || !tok ? esc(tok) : `<span class="w" data-o="${start}" data-e="${start + tok.length}">${esc(tok)}</span>`;
    }).join("");
    pos += 1; // the "\n" between paragraphs
    return `<p>${html}</p>`;
  });
  return `<div class="narration" id="narration">${paras.join("")}</div>`;
}

function listenHTML() {
  return `<div class="listen" id="listen">
    <div class="row">
      <button class="play" id="l-play" type="button" aria-label="להאזין">${PLAY_ICON}</button>
      <div class="bar">
        <div class="track" id="l-track"><div class="fill" id="l-fill"></div></div>
        <div class="time"><span id="l-cur">0:00</span><span id="l-dur"></span></div>
      </div>
    </div>
    <button class="music" id="l-music" type="button" aria-pressed="${state.music !== false}">מוזיקת רקע: ${state.music !== false ? "פועלת" : "כבויה"}</button>
  </div>`;
}

const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function stopListening() {
  if (!listen) return;
  listen.voice.pause(); musicDuck(false);
  listen.voice.removeAttribute("src"); listen.voice.load();
  cancelAnimationFrame(listen.raf);
  listen = null;
}

function bindListen(c) {
  stopListening();
  const spans = [...document.querySelectorAll("#narration .w")];
  // for each timed word, the span that holds it
  const words = c.timing.words.map(([t, d, o]) => ({ t, d, i: spans.findIndex(s => o >= +s.dataset.o && o < +s.dataset.e) })).filter(w => w.i >= 0);
  const voice = new Audio(c.audio); voice.preload = "metadata";
  const L = listen = { voice, raf: 0, current: -1 };
  const narr = $("#narration"), playBtn = $("#l-play");
  $("#l-dur").textContent = mmss(c.timing.end || 0);
  voice.addEventListener("loadedmetadata", () => { $("#l-dur").textContent = mmss(voice.duration); });

  function indexAt(t) {
    let lo = 0, hi = words.length - 1, ans = -1;
    while (lo <= hi) { const k = (lo + hi) >> 1; if (words[k].t <= t + 0.05) { ans = k; lo = k + 1; } else hi = k - 1; }
    if (ans >= 0 && t > words[ans].t + words[ans].d + 0.6) return -1; // pause between paragraphs
    return ans;
  }
  function mark(k) {
    const i = k >= 0 ? words[k].i : -1;
    if (i === L.current) return;
    const upTo = i >= 0 ? i : L.current;
    spans.forEach((s, j) => { s.classList.toggle("read", j < upTo || (i < 0 && j <= upTo)); s.classList.toggle("now", j === i); });
    if (i >= 0) {
      const r = spans[i].getBoundingClientRect();
      if (r.top < 80 || r.bottom > innerHeight - 120) spans[i].scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      L.current = i;
    }
  }
  function tick() {
    if (listen !== L) return;
    const t = voice.currentTime;
    mark(indexAt(t));
    $("#l-cur").textContent = mmss(t);
    if (voice.duration) $("#l-fill").style.width = `${(t / voice.duration) * 100}%`;
    if (!voice.paused) L.raf = requestAnimationFrame(tick);
  }
  function setUI(on) {
    playBtn.innerHTML = on ? PAUSE_ICON : PLAY_ICON;
    playBtn.setAttribute("aria-label", on ? "השהיה" : "להאזין");
    narr.classList.toggle("playing", on || voice.currentTime > 0);
  }

  playBtn.addEventListener("click", async () => {
    if (voice.paused) {
      if (voice.ended) voice.currentTime = 0;
      try { await voice.play(); } catch { toast("לא הצלחנו לנגן. כדאי לבדוק את החיבור לרשת."); return; }
    } else voice.pause();
  });
  voice.addEventListener("play", () => { setUI(true); musicDuck(true); tick(); });
  voice.addEventListener("pause", () => { setUI(false); musicDuck(false); });
  voice.addEventListener("ended", () => { setUI(false); mark(-1); musicDuck(false); }); // the music keeps going

  $("#l-music").addEventListener("click", e => {
    state.music = !musicOn(); save();
    e.currentTarget.setAttribute("aria-pressed", String(musicOn()));
    e.currentTarget.textContent = `מוזיקת רקע: ${musicOn() ? "פועלת" : "כבויה"}`;
    musicSync();
  });
  narr.addEventListener("click", e => {
    const s = e.target.closest(".w"); if (!s || !voice.duration) return;
    const i = spans.indexOf(s);
    const w = words.find(x => x.i >= i);
    if (w) { voice.currentTime = Math.max(0, w.t - 0.05); L.current = -2; tick(); }
  });
  $("#l-track").addEventListener("click", e => {
    if (!voice.duration) return;
    const r = e.currentTarget.getBoundingClientRect();
    voice.currentTime = ((r.right - e.clientX) / r.width) * voice.duration; // fills from the right
    L.current = -2; tick();
  });
}

function backBar() {
  return `<div class="topbar"><button class="back" id="back" type="button">${ICON.back}חזרה</button><span class="brand" style="font-size:18px">חיים שלי</span></div>`;
}
function bindBack() { $("#back")?.addEventListener("click", () => { location.hash = "#/"; }); }

function checkHTML(on, label) {
  return `<button class="check" type="button" data-done aria-pressed="${Boolean(on)}"><span class="box">${ICON.check}</span><span>${esc(label)}</span></button>`;
}

function partHTML(n, part, content, a, onShabbat) {
  const vals = a[part] || {};
  const blocks = content.blocks.map((b, i) => blockHTML(n, part, b, i, vals[i])).join("");
  const noteKey = part + "Note";
  const note = a[noteKey] || "";
  const onlyText = content.blocks.every(b => b.type === "text");
  const isEvening = part === "evening";
  return `<section class="part" data-part="${part}">
    <div class="part-title"><h2>${isEvening ? "שאלה לערב" : esc(content.title || "הצעד של היום")}</h2>
      <span class="when">${isEvening ? (onShabbat ? "במוצאי שבת" : "בערב") : "היום"}</span></div>
    ${blocks}
    ${isEvening && onlyText
      ? `<textarea data-note="${noteKey}" rows="3" maxlength="1000" placeholder="כמה מילים, רק לעצמך">${esc(note)}</textarea>`
      : `<button class="btn quiet note-toggle" type="button" data-note-toggle="${noteKey}" ${note ? "hidden" : ""}>+ להוסיף כמה מילים משלי</button>
         <textarea data-note="${noteKey}" rows="3" maxlength="1000" placeholder="כמה מילים, רק לעצמך" ${note ? "" : "hidden"}>${esc(note)}</textarea>`}
    ${part === "step" && n !== 1 ? checkHTML(a.stepDone, "עשיתי את הצעד") : ""}
  </section>`;
}

function blockHTML(n, part, b, i, value) {
  const id = `${part}-${i}`;
  if (b.type === "text") return `<p class="block">${esc(b.text)}</p>`;
  if (b.type === "choice") {
    const picked = Array.isArray(value) ? value : value != null ? [value] : [];
    return `<div class="block" role="group" aria-labelledby="${id}">
      ${b.prompt ? `<p class="prompt" id="${id}">${esc(b.prompt)}</p>` : ""}
      ${b.multi ? `<p class="small muted">אפשר לבחור יותר מאחת</p>` : ""}
      <div class="chips" data-choice="${i}" data-multi="${b.multi ? 1 : 0}">
        ${b.options.map((o, k) => `<button type="button" class="chip" data-k="${k}" aria-pressed="${picked.includes(k)}">${esc(o)}</button>`).join("")}
      </div>
      ${compareChoice(n, b, picked)}
    </div>`;
  }
  if (b.type === "rating") {
    return `<div class="block" role="group" aria-labelledby="${id}">
      <p class="prompt" id="${id}">${esc(b.prompt)}</p>
      <div class="scale" data-rating="${i}">
        ${Array.from({ length: 10 }, (_, k) => `<button type="button" data-v="${k + 1}" aria-pressed="${value === k + 1}" aria-label="${k + 1}">${k + 1}</button>`).join("")}
      </div>
      <div class="scale-ends"><span>1 · בכלל לא</span><span>10 · לגמרי</span></div>
      ${compareRating(n, b, value)}
    </div>`;
  }
  return "";
}

// after answering, show what he answered on day 1 (never before, so it won't steer him)
function compareRating(n, b, value) {
  if (n === 1 || !b.key || value == null) return "";
  const first = answerByKey(1, b.key);
  if (first == null) return "";
  const diff = value - first;
  const word = diff > 0 ? `עלייה של ${diff}` : diff < 0 ? `ירידה של ${-diff}` : "אותו מקום";
  return `<p class="compare">ביום 1 ענית <b>${first}</b>. היום <b>${value}</b> · ${word}</p>`;
}
function compareChoice(n, b, picked) {
  if (n === 1 || b.key !== "fulfilled" || !picked.length) return "";
  const first = answerByKey(1, "fulfilled");
  const list = Array.isArray(first) ? first : first != null ? [first] : [];
  if (!list.length) return "";
  return `<p class="compare">ביום 1 בחרת: <b>${list.map(k => esc(b.options[k])).join(", ")}</b></p>`;
}

function bindDay(n, c) {
  const root = $("#view").firstElementChild; // new element on every render, so listeners never pile up
  root.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    const rate = e.target.closest("[data-rating] button");
    const done = e.target.closest("[data-done]");
    const noteBtn = e.target.closest("[data-note-toggle]");
    if (chip) {
      const group = chip.closest("[data-choice]"), part = chip.closest(".part").dataset.part;
      const i = Number(group.dataset.choice), multi = group.dataset.multi === "1", k = Number(chip.dataset.k);
      const a = ans(n); a[part] = a[part] || {};
      if (multi) {
        const cur = new Set(Array.isArray(a[part][i]) ? a[part][i] : []);
        cur.has(k) ? cur.delete(k) : cur.add(k);
        if (cur.size) a[part][i] = [...cur].sort((x, y) => x - y); else delete a[part][i];
      } else if (a[part][i] === k) delete a[part][i];
      else a[part][i] = k;
      afterAnswer(n, c, part, i, group);
    } else if (rate) {
      const group = rate.closest("[data-rating]"), part = rate.closest(".part").dataset.part;
      const i = Number(group.dataset.rating), v = Number(rate.dataset.v);
      const a = ans(n); a[part] = a[part] || {};
      if (a[part][i] === v) delete a[part][i]; else a[part][i] = v;
      afterAnswer(n, c, part, i, group);
    } else if (done) {
      const a = ans(n); a.stepDone = !a.stepDone; touch(n);
      done.setAttribute("aria-pressed", String(a.stepDone));
      if (a.stepDone && dayStatus(n) === "done") toast(n === 90 ? "סיימת את 90 הימים." : `יום ${n} הושלם`);
    } else if (noteBtn) {
      noteBtn.hidden = true;
      const t = root.querySelector(`textarea[data-note="${noteBtn.dataset.noteToggle}"]`);
      t.hidden = false; t.focus();
    }
  });
  root.querySelectorAll("textarea[data-note]").forEach(t => {
    let timer;
    const store = () => { ans(n)[t.dataset.note] = t.value.trim() ? t.value : ""; touch(n); };
    t.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(store, 350); });
    t.addEventListener("blur", () => { clearTimeout(timer); store(); });
  });
}

// day 1 has no "done" button: answering the whole starting point completes it
function syncDayOne(n, c) {
  if (n !== 1) return;
  const a = ans(1);
  const need = (c.step?.blocks || []).filter(b => b.type !== "text").length;
  a.stepDone = Object.keys(a.step || {}).length >= need;
}

function afterAnswer(n, c, part, i, group) {
  const wasDone = dayStatus(n) === "done";
  syncDayOne(n, c);
  touch(n);
  const block = group.closest(".block");
  const tmp = document.createElement("div");
  tmp.innerHTML = blockHTML(n, part, c[part].blocks[i], i, ans(n)[part][i]);
  block.replaceWith(tmp.firstElementChild);
  if (!wasDone && dayStatus(n) === "done") toast(n === 1 ? "נקודת הפתיחה נשמרה" : `יום ${n} הושלם`);
}

// ---------- journal
function summary(n, part, content, a) {
  const out = [];
  (content?.[part]?.blocks || []).forEach((b, i) => {
    const v = a[part]?.[i];
    if (v == null) return;
    const label = b.prompt ? b.prompt.replace(/[:?]$/, "") : part === "step" ? "בחרתי" : "בערב";
    if (b.type === "rating") out.push(`<li>${esc(label)}: <b>${v}</b></li>`);
    if (b.type === "choice") out.push(`<li>${esc(label)}: <b>${(Array.isArray(v) ? v : [v]).map(k => esc(b.options[k])).join(", ")}</b></li>`);
  });
  const note = a[part + "Note"];
  if (note) out.push(`<li>${esc(note)}</li>`);
  return out.join("");
}

function renderJournal() {
  const days = Object.keys(state.answers).map(Number).filter(n => {
    const a = state.answers[n];
    return a && (Object.keys(a.step || {}).length || Object.keys(a.evening || {}).length || a.stepNote || a.eveningNote || a.stepDone);
  }).sort((x, y) => y - x);
  $("#view").innerHTML = `
    <div class="stack-lg">
      <div class="topbar"><span class="brand">היומן שלי</span></div>
      <p class="small muted">כל מה שענית, יום אחרי יום. זה נמצא רק בטלפון הזה.</p>
      <div>
        ${days.length ? days.map(n => {
          const c = dayContent(n), a = state.answers[n];
          const step = summary(n, "step", c, a), ev = summary(n, "evening", c, a);
          return `<article class="entry">
            <a href="#/day/${n}" style="text-decoration:none"><span class="meta">יום ${n}${a.at ? " · " + new Date(a.at).toLocaleDateString("he-IL", { day: "numeric", month: "long" }) : ""}</span>
            <h3>${esc(c?.title || dayMeta(n).title)}</h3></a>
            ${step ? `<ul>${step}</ul>` : a.stepDone ? `<p class="small muted">עשיתי את הצעד</p>` : ""}
            ${ev ? `<ul>${ev}</ul>` : ""}
          </article>`;
        }).join("") : `<p class="empty">עוד אין כאן כלום. מה שתענה בימים יופיע כאן.</p>`}
      </div>
    </div>`;
}

// ---------- settings
function renderSettings() {
  const full = program?.access === "full";
  const draft = { ...state.profile };
  $("#view").innerHTML = `
    <div class="settings">
      <div class="topbar"><span class="brand">הגדרות</span></div>
      <section>
        <h2>הפרטיות שלך</h2>
        <p class="muted small">התשובות, ההערות וההתקדמות נשמרים רק בטלפון הזה. אין חשבון, אין שרת שמחזיק אותם, ואין מעקב. אם מוחקים את האפליקציה או מחליפים טלפון, הם נמחקים, ולכן כדאי לשמור גיבוי מדי פעם.</p>
      </section>
      <section>
        <h2>גיבוי</h2>
        <p class="muted small">קובץ אחד עם כל מה שכתבת. אפשר לשמור אותו איפה שנוח לך, ולשחזר ממנו בטלפון חדש.</p>
        <div class="row">
          <button class="btn" id="export" type="button">שמירת גיבוי</button>
          <label class="btn ghost" for="import-file" style="cursor:pointer">שחזור מגיבוי</label>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </section>
      <section>
        <h2>התוכנית</h2>
        <p><span class="pill">${full ? "תוכנית מלאה · 90 ימים" : `אתגר חינמי · ${program?.freeDays || 3} ימים`}</span></p>
        ${full ? "" : `<p class="muted small">קיבלת קישור או קוד לתוכנית המלאה? הדבק אותו כאן.</p>
        <form id="code-form" class="stack" style="gap:10px">
          <input type="text" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="הקישור או הקוד מהמייל" aria-label="קוד גישה">
          <button class="btn ghost" type="submit">הפעלה</button>
        </form>`}
        <p class="muted small">התחלת ב${state.start ? parseISO(state.start).toLocaleDateString("he-IL", { day: "numeric", month: "long", year: "numeric" }) : "—"}.</p>
      </section>
      <section>
        <h2>מותאם אליך</h2>
        <form id="pf" class="stack">
          ${segField("shabbat", "שומר שבת?", "", draft.shabbat)}
          ${segField("relationship", "בזוגיות?", "", draft.relationship)}
          ${segField("kids", "יש לך ילדים?", "", draft.kids)}
        </form>
      </section>
      ${pushSettingsHTML()}
      ${isStandalone() ? "" : `<section><h2>הוספה למסך הבית</h2>${installSteps()}</section>`}
      <section>
        <h2>מחיקה</h2>
        <p class="muted small">מוחק מהטלפון את כל התשובות וההתקדמות. אי אפשר לבטל את זה.</p>
        <button class="btn ghost" id="wipe" type="button">למחוק הכול</button>
      </section>
      <p class="small muted" style="padding-block:12px">שאלות? <span style="direction:ltr;unicode-bidi:isolate">gever@haim-sheli.com</span></p>
    </div>`;

  const pf = $("#pf");
  bindSegs(pf, draft);
  pf.addEventListener("segchange", () => { state.profile = { ...draft }; save(); toast("נשמר"); syncPush(true); });
  bindPushSettings();

  $("#export").onclick = exportBackup;
  $("#import-file").onchange = e => importBackup(e.target.files[0]);
  $("#code-form")?.addEventListener("submit", async e => {
    e.preventDefault();
    const raw = $("#code").value.trim();
    const code = extractCode(raw);
    if (!code) return toast("זה לא נראה כמו קוד גישה. כדאי להעתיק שוב את הקישור מהמייל.");
    await activate(code);
  });
  $("#wipe").onclick = () => {
    openSheet(`<h2 style="font-size:24px">למחוק את כל מה שכתבת?</h2>
      <p class="muted">כל התשובות, ההערות וההתקדמות יימחקו מהטלפון. אם אין לך גיבוי, אי אפשר לשחזר אותם.</p>
      <div class="stack"><button class="btn wide" id="wipe-yes" type="button">כן, למחוק</button>
      <button class="btn ghost wide" data-close type="button">ביטול</button></div>`);
    $("#wipe-yes").onclick = async () => {
      if (state.push?.on) await disablePush();
      try { localStorage.removeItem(KEY); localStorage.removeItem("hs-install-dismissed"); } catch {}
      const code = state.code;
      state = blank(); state.code = code; save(); // keeps only the purchase code
      $("#sheet").innerHTML = "";
      location.hash = "#/"; route();
    };
  };
}

function extractCode(raw) {
  const m = /(?:[?&]k=)?(full\.[\w-]{12}\.[\w-]{24})/.exec(raw);
  return m ? m[1] : null;
}

async function activate(code) {
  const prev = state.code;
  state.code = code; save();
  try {
    const data = await fetchProgram();
    if (data.access === "full") { toast("התוכנית המלאה פתוחה. בהצלחה."); syncPush(true); location.hash = "#/"; route(); return; }
    state.code = prev; save();
    toast("הקוד לא עבד. כדאי לבדוק שהעתקת את כולו.");
  } catch {
    toast("אין חיבור כרגע. ננסה שוב כשיהיה.");
  }
}

function exportBackup() {
  const data = { app: "haim-sheli", version: 1, exported: new Date().toISOString(), data: state };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
  const name = `haim-sheli-${todayISO()}.json`;
  const file = new File([blob], name, { type: "application/json" });
  // on phones the share sheet lets him choose where to keep it (Files, Drive, himself in a chat)
  if (navigator.canShare?.({ files: [file] })) {
    navigator.share({ files: [file], title: "גיבוי חיים שלי" }).catch(() => {});
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function importBackup(file) {
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    if (parsed?.app !== "haim-sheli" || !parsed.data?.answers) throw new Error("bad file");
    const incoming = Object.assign(blank(), parsed.data);
    openSheet(`<h2 style="font-size:24px">לשחזר מהגיבוי?</h2>
      <p class="muted">הגיבוי מ־${esc(new Date(parsed.exported).toLocaleDateString("he-IL"))} יחליף את מה שיש עכשיו בטלפון.</p>
      <div class="stack"><button class="btn wide" id="imp-yes" type="button">לשחזר</button>
      <button class="btn ghost wide" data-close type="button">ביטול</button></div>`);
    $("#imp-yes").onclick = async () => {
      state = incoming; save();
      $("#sheet").innerHTML = "";
      toast("השחזור הושלם");
      try { await fetchProgram(); } catch {}
      location.hash = "#/"; route();
    };
  } catch {
    toast("הקובץ הזה לא נראה כמו גיבוי של חיים שלי.");
  }
}

// ---------------------------------------------------------------- start
async function start() {
  // a code arriving in the link (?k=...) is kept on the device and removed from the address bar
  const params = new URLSearchParams(location.search);
  const k = params.get("k");
  if (k) {
    const code = extractCode(k);
    if (code) { state.code = code; save(); }
    history.replaceState(null, "", "/app" + location.hash);
  }

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/app-sw.js", { scope: "/app" }).catch(() => {});

  if (program) route(); // show the cached content right away
  try {
    const before = program?.access;
    const data = await fetchProgram();
    if (k && data.codeRejected) toast("הקוד בקישור לא עבד. אפשר להדביק אותו שוב בהגדרות.");
    if (k && data.access === "full" && before !== "full") toast("התוכנית המלאה פתוחה.");
    if (!location.hash.startsWith("#/day/") || !before) route(); // don't redraw under his fingers
    syncPush(false);
  } catch {
    if (!program) route(); // offline on first open: route shows the "need network" card
  }
}
start();
})();
</script>
